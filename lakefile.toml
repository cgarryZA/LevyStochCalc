name = "LevyStochCalc"
version = "0.1.0"
keywords = ["math", "stochastic-calculus", "levy-processes"]
defaultTargets = ["LevyStochCalc"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# RemyDegenne/brownian-motion: the Brownian motion construction (`brownian` on `gaussianLimit`,
# `isBrownianReal_brownian`) that discharges cited axiom #1. Pinned to the commit whose
# lake-manifest resolves Mathlib to this repo's pin (81a5d257), so no second Mathlib is built.
# Declared BEFORE mathlib: Lake resolves transitive conflicts in favour of later requires, so
# mathlib-last keeps batteries/aesop/etc. at Mathlib's own revs.
[[require]]
name = "BrownianMotion"
git = "https://github.com/RemyDegenne/brownian-motion.git"
rev = "4d52fa776130a29d4ad7d6eda2035a919c0b4696"

# raphaelrrcoelho/formal-mathfin: the compensated-Poisson (Itô-Lévy) `L²` isometry on the closure
# of marked simple integrands, consumed through `Poisson/MathFinBridge.lean` (cited axiom #6's
# isometry conjunct). Pinned to the commit whose lake-manifest resolves Mathlib to this repo's pin
# and BrownianMotion to the revision required above. Declared before mathlib for the same reason.
[[require]]
name = "MathFin"
git = "https://github.com/raphaelrrcoelho/formal-mathfin.git"
rev = "784a8311f75a1519a23717856df9982bd6a9a370"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

[[lean_lib]]
name = "LevyStochCalc"

# P10 F4 fix (red-team 2nd audit, 2026-05-23): examples library for
# end-to-end public-API usage examples. Compiles separately from the
# main library to keep example breakage from blocking the headline
# build, but is verified by `lake build LevyStochCalcExamples`.
[[lean_lib]]
name = "LevyStochCalcExamples"
srcDir = "examples"
roots = ["ItoLevyIsometryUsage"]
