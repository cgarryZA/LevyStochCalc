name: CI

on:
  # 2026-09-08 (Dissertation RELEASE_READINESS.md X2f): `push` used to be
  # scoped to master/main like `pull_request` below, so a feature branch
  # got no CI at all until its PR opened. Trigger `push` on every branch;
  # `pull_request` stays scoped to master/main (no need to double-build a
  # branch's own pushes and its PR into master on every commit).
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

# P2 MEDIUM-2 fix (red-team 2nd audit 2026-05-23): cancel in-progress runs
# when a new push for the same ref lands. Saves a full Mathlib rebuild on
# rapid-fire pushes to the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    # 2026-09-11: 60 minutes was not enough for a cold runner — the run for
    # 3b07027 missed both caches and was cancelled while still compiling
    # Mathlib, so lint and the import contract never ran. The Mathlib olean
    # cache is now restored with `lake exe cache get` before the build, the
    # limit is raised, and the build/audit transcripts are kept as artifacts.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      # P2 MEDIUM-1 fix (red-team 2nd audit 2026-05-23): cache `~/.elan`
      # in addition to `.lake`. Without this, the Lean toolchain (~200 MB)
      # is re-downloaded on every CI run, burning ~30s of bandwidth/decomp
      # per run for no benefit. Key off `lean-toolchain` so cache invalidates
      # when the toolchain pin changes.
      - name: Cache ~/.elan (Lean toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            elan-${{ runner.os }}-

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lakefile.toml', 'lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Lean version
        run: lean --version

      # Mathlib ships prebuilt oleans for its pinned commit; fetching them
      # turns a multi-hour cold build into a build of this library and its
      # two source dependencies only. `|| true`: a cache miss must not fail
      # the job, it only makes the build slower.
      - name: Restore the Mathlib olean cache
        run: lake exe cache get || true

      - name: lake build
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build_output.txt

      - name: tools/lint.sh
        shell: bash
        run: |
          set -o pipefail
          bash tools/lint.sh 2>&1 | tee lint_output.txt

      # Keep the transcripts whether or not the steps above passed, so a red
      # run can be diagnosed from the artifact instead of re-run.
      - name: Upload build and audit transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-audit-output
          path: |
            build_output.txt
            lint_output.txt
            audit_output.txt
          if-no-files-found: ignore

      # Red-team 3rd-audit HIGH #6 fix (2026-05-27): verify the dissertation-
      # import contract from `tools/import_contract.md` resolves on master.
      # The dissertation at `D:/Dissertation` (private repo, path-deps into
      # this one) imports 12 pinned modules + 21 pinned symbols; a refactor
      # that deletes/renames any of them must leave a forwarding stub at the
      # old path so the dissertation continues to build. This step prevents
      # silent contract breakage on `master`.
      - name: tools/verify_import_contract.sh
        run: bash tools/verify_import_contract.sh
